<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transferencia Bancaria — Neural Flow</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/neural-theme.css">
</head>
<body>
    <!-- Neural Background -->
    <div class="neural-bg">
        <canvas id="neuralBg"></canvas>
    </div>
    <div class="neural-gradient"></div>

    <!-- App Container -->
    <div class="app-container">
        <!-- Header -->
        <header class="neural-header">
            <div class="header-left">
                <a href="../index.html" class="back-link">←</a>
                <div class="header-logo">
                    <div class="logo-icon">🔄</div>
                    <div class="logo-text">
                        <h1>Transferencia Bancaria</h1>
                        <span>Money Out / In</span>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span>Sistema activo</span>
                </div>
                <button class="header-btn" id="resetBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                    <span>Reset</span>
                </button>
            </div>
        </header>

        <!-- Main Layout -->
        <main class="main-layout">
            <!-- Canvas Area -->
            <div class="canvas-area"></div>

            <!-- Sidebar -->
            <aside class="sidebar-panel"></aside>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../js/neural/background.js"></script>
    <script src="../js/neural/simulation.js"></script>
    <script src="../js/neural/renderer.js"></script>
    <script src="../js/neural/flow-configs.js"></script>
    <script src="../js/neural/app.js"></script>
    <script>
        // Inicializar app con el flujo de transferencia
        const app = new NeuralApp('transfer');
    </script>
</body>
</html>
