<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de 4 Partes — Ecosistema de Pagos</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/actors.css">
    <link rel="stylesheet" href="css/connections.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <div class="bg-pattern"></div>

    <!-- Header -->
    <header class="header" id="header"></header>

    <!-- Main Content -->
    <main class="main-container">
        <!-- Diagram Area -->
        <div class="diagram-area" id="diagramArea"></div>
        
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar"></aside>
    </main>

    <!-- Templates (hidden) -->
    <template id="actor-template">
        <div class="actor-card" data-actor="">
            <span class="mp-badge"></span>
            <div class="actor-header">
                <div class="actor-icon"></div>
                <div class="actor-info">
                    <h3 class="actor-name"></h3>
                    <p class="actor-desc"></p>
                </div>
            </div>
        </div>
    </template>

    <!-- Scripts -->
    <script src="js/data/actors.js"></script>
    <script src="js/data/steps.js"></script>
    <script src="js/data/fees.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/components/diagram.js"></script>
    <script src="js/components/sidebar.js"></script>
    <script src="js/core/state.js"></script>
    <script src="js/core/animation.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
